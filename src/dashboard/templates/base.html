<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI工具热点机会仪表板{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">AI Opportunity Dashboard</h1>
            <ul class="nav-links">
                <li><a href="/">首页</a></li>
                <li><a href="/tools">AI工具</a></li>
                <li><a href="/trends">热点话题</a></li>
                <li><a href="/opportunities">机会榜</a></li>

    <main class="main-content">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 AI工具热点机会仪表板</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/tools.js') }}"></script>

</html>
